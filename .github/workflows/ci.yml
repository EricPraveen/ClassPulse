name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify build environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Maven Version ==="
          mvn -version

      - name: Build and verify all modules
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Archive compiled artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: classpulse-jars
          path: |
            common/target/*.jar
            server/target/*.jar
            client/target/*.jar
          retention-days: 7
          if-no-files-found: warn
